name: Timeline E2E (visual + a11y + perf)

# Estas pruebas cubren la sección "Continuidad Operativa" del Home:
#   - chequeo estructural del timeline (5 nodos activos por viewport)  -> BLOQUEA
#   - regresión visual pixel-diff (densidades, zoom, rotación, temas)  -> informativo
#   - accesibilidad (prefers-reduced-motion, teclado, axe-core WCAG 2 A/AA)
#   - CTA con teclado (Enter/Space) en todos los viewports
#   - rendimiento (tiempo de activación y frames perdidos)
#
# El job corre DENTRO de la imagen oficial de Playwright para que Chromium y las
# fuentes coincidan con el entorno donde se generan las capturas base. Si se
# regeneran bases en otro entorno, el pixel-diff fallará en masa: hay que
# regenerarlas con esta misma imagen:
#   docker run --rm -v "$PWD":/w -w /w mcr.microsoft.com/playwright:v1.56.0-jammy \
#     bash -c "pip install pillow && python3 tests/e2e/continuidad-timeline-visual.py --update"
#
# Para que un fallo BLOQUEE el merge, marca el job "timeline-e2e" como
# "Required status check" en: Settings > Branches > Branch protection rules > main.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  timeline-e2e:
    name: timeline-e2e
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.0-jammy
      options: --ipc=host
    timeout-minutes: 25
    env:
      APP_URL: http://localhost:8080
      # Tolerancia algo mayor en CI: pequeñas diferencias de antialiasing
      TIMELINE_DIFF_TOLERANCE: "0.01"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install test deps
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install playwright pillow

      - name: Install app deps
        run: bun install --frozen-lockfile

      - name: Build app
        run: bun run build

      - name: Serve build
        run: |
          bunx --bun vite preview --port 8080 --strictPort --host > /tmp/preview.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -sf -o /dev/null http://localhost:8080/ || (cat /tmp/preview.log; exit 1)

      - name: Structural check (5 nodos activos por viewport)
        run: python3 tests/e2e/continuidad-timeline-visual.py --structural-only

      - name: Visual regression (pixel diff, informativo)
        continue-on-error: true
        run: python3 tests/e2e/continuidad-timeline-visual.py

      - name: Accessibility audit (timeline)
        if: always()
        run: python3 tests/e2e/continuidad-timeline-a11y.py

      - name: CTA keyboard focus (todos los viewports)
        if: always()
        run: python3 tests/e2e/continuidad-timeline-cta-keyboard.py

      - name: Performance (activación y frames)
        if: always()
        run: python3 tests/e2e/continuidad-timeline-perf.py

      - name: Upload artifacts (trace, video, diffs, screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: timeline-e2e-artifacts
          path: |
            tests/e2e/artifacts/**
            tests/e2e/screenshots/timeline/**
            tests/e2e/screenshots/timeline-cta/**
          retention-days: 7
          if-no-files-found: ignore
