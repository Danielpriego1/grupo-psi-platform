# Deploy workflow v2
name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build project
        run: bun run build
        env:
          NODE_ENV: production

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "=== Iniciando deploy ==="
            cd /var/www/grupopsi
            git pull origin main
            export PATH="/usr/local/bin:/usr/bin:/bin:$PATH"
            which npm || (curl -fsSL https://deb.nodesource.com/setup_20.x | sudo -E bash - && sudo apt-get install -y nodejs)
            npm install
            npm run build
            pm2 restart grupo-psi 2>/dev/null || pm2 start npm --name grupo-psi -- start
            sudo nginx -t && sudo systemctl reload nginx
            echo "=== Deploy completado ==="
