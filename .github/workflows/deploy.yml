# Deploy to the Contabo VPS (94.72.113.32) and Supabase.
# Successor of the pre-lapsis deploy.yml (SSH + git pull + pm2 + nginx),
# rebuilt for the current architecture: Caddy serves /var/www/grupopsi as
# static files, so no daemon restart is needed, just an atomic-ish rsync.
#
# Secrets this workflow expects (repository Settings > Secrets and variables > Actions):
#   DEPLOY_HOST            94.72.113.32
#   DEPLOY_USER            dani
#   DEPLOY_SSH_KEY         ed25519 private key whose PUBLIC half is in that user's authorized_keys
#   SUPABASE_ACCESS_TOKEN  personal access token for functions deploys (kept in flock)
# Nothing is rebuilt on the VPS anymore: CI builds, the VPS only receives files.

name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "index.html"
      - "package.json"
      - "bun.lock"
      - "vite.config.ts"
      - "tailwind.config.ts"
      - "tsconfig*.json"
      - "supabase/functions/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

jobs:
  site:
    name: Build & rsync static site
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-site
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production

      # Validate the secrets before touching ~/.ssh. A missing secret used to
      # surface only as "ssh-keyscan failed" with stderr swallowed, which made
      # every run since the workflow was written fail with no actionable hint.
      - name: Validate deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=()
          [[ -n "${DEPLOY_HOST}" ]] || missing+=("DEPLOY_HOST")
          [[ -n "${DEPLOY_USER}" ]] || missing+=("DEPLOY_USER")
          [[ -n "${DEPLOY_SSH_KEY}" ]] || missing+=("DEPLOY_SSH_KEY")
          if (( ${#missing[@]} )); then
            echo "::error::Missing repository secrets: ${missing[*]}"
            echo "Add them in Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Deploy secrets present; target host: ${DEPLOY_HOST}"

      - name: Set up SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # The key goes through env, not inline interpolation, so a key body
          # can never be reinterpreted as shell syntax.
          printf '%s\n' "${DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          # TOFU host key acceptance: the VPS key is pinned on first contact.
          # Rotate by deleting the line from known_hosts and re-running.
          if ! ssh-keyscan -T 10 -p 22 "${DEPLOY_HOST}" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "::error::ssh-keyscan could not reach ${DEPLOY_HOST}:22"
            cat /tmp/keyscan.err
            exit 1
          fi

      - name: Rsync dist to /var/www/grupopsi
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          # BatchMode makes a rejected key fail fast instead of hanging on a
          # password prompt that CI can never answer.
          rsync -a --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o BatchMode=yes -o StrictHostKeyChecking=yes" \
            dist/ "${DEPLOY_USER}@${DEPLOY_HOST}:/var/www/grupopsi/"

      - name: Smoke check the public URL
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 https://grupopsi.com/) || code="000"
            echo "attempt ${attempt}: grupopsi.com -> ${code}"
            if [[ "${code}" == "200" ]]; then
              exit 0
            fi
            sleep 3
          done
          echo "::error::smoke check failed: grupopsi.com never returned 200"
          exit 1

  sora-chat:
    name: Deploy sora-chat edge function
    runs-on: ubuntu-latest
    # Deploying every function unconditionally would push stale branches of
    # them; scope to the chat function the workspace actually changed.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(join(github.event.commits.*.modified, ' '), 'supabase/functions/') ||
      contains(join(github.event.commits.*.added, ' '), 'supabase/functions/') ||
      contains(join(github.event.commits.*.removed, ' '), 'supabase/functions/')
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy sora-chat
        run: |
          set -euo pipefail
          if [[ -z "${SUPABASE_ACCESS_TOKEN}" ]]; then
            echo "::error::Missing repository secret SUPABASE_ACCESS_TOKEN"
            echo "Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi
          supabase functions deploy sora-chat --project-ref wcnbqlpbqansyvslxlth
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  # To deploy more functions later, widen this job to a matrix over
  # supabase/functions/*/ names instead of hand-picking slugs.
